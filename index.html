<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM-68361 — Customers (UAT-aligned prototype)</title>
<!--
  DM-68361 — Dari Admin › Customers
  Rebuilt against the UAT screenshots (Gov 1-11, Companies 1-22, Persons 1-15).

  EVIDENCED from screenshots:
    - Search panel = ID Number / Trade License Number, Name (Arabic), Name (English),
      Page Size  + NEW Email Address + Phone Number  (the two new params are the ticket)
    - Grid columns per category, Name (AR) and Name (EN) as separate columns
    - Row actions = amber gear + caret; Persons has 4 items incl. [CustomerSubscription]
    - Persons: 4 tabs. Companies: 7 tabs. Gov: 3 tabs (no Block Details)
    - Block Details sections COLLAPSED by default; ESB renders as cards;
      Blocked plot(s) & owner(s) has a nested two-level drill-down
    - Edit gear = small identity modal. Full flow = EDIT CUSTOMER DETAILS on Documents tab
      -> Customer Profile Update application page with sidebar + per-doc-type sections
    - Customer Exception = gear / Customer / Workflow / Name (AR) / Name (EN);
      ADD modal has NameA, NameE, Redirection|RoleActivity radio, SEARCH, checkbox list;
      row gear contains Delete only
    - Delete confirm = orange (!) circle, Cancel / Yes

  NOT YET EVIDENCED (Persons images 16-43 unread) - marked UNVERIFIED in the UI:
    - Persons POA contract drill-down, Persons document section list,
      [CustomerSubscription], the Address list from the ticket
-->
<style>
:root{
  --olive:#ACA261; --olive-dk:#8E8449; --olive-soft:#F4F2E6;
  --sage:#A9CC96; --sage-pill:#BCDCAC; --sage-soft:#EAF3E4; --sage-dk:#6E9455;
  --green:#4CAF50; --green-tx:#2E7D32;
  --red:#E5484D; --red-tx:#C62828; --red-soft:#FDECEC;
  --amber:#D9962B; --amber-tx:#A9700F; --amber-soft:#FCF3E3;
  --blue:#1A73E8;
  --page:#F7F7F5; --surface:#fff; --line:#E8E8E4; --line-2:#F0F0EC;
  --thead:#F3F2EA; --hover:#EFF1F3;
  --zebra:#F7F8F9; --row-line:#E5E7EB;
  --search-btn:#B8CEB1; --search-btn-dk:#A6C09D;
  --ink:#130F26; --ink-2:#3C3C3C; --muted:#6E7278; --grey:#9AA0A6;
  --r:10px; --r-sm:8px; --r-xs:6px;
  --shadow:0 1px 2px rgba(20,20,20,.04);
}
html,body{margin:0;padding:0;}
body{background:var(--page);color:var(--ink);
font:14px/1.55 Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
-webkit-font-smoothing:antialiased;}
body[dir=rtl]{font-family:"Noto Kufi Arabic",Inter,"Segoe UI",Tahoma,sans-serif;}
*{box-sizing:border-box;}
button{font:inherit;cursor:pointer;}
input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px;}

/* ══ top bar ══ */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);
padding:14px 34px;display:flex;align-items:center;gap:16px;}
.svgi{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.svgi svg{width:100%;height:100%;display:block;}
.svgi.rot svg{transform:rotate(-90deg);}
body[dir=rtl] .svgi.rot svg{transform:rotate(90deg);}
.svgi.flip svg{transform:scaleX(-1);}
body[dir=rtl] .svgi.dir svg{transform:scaleX(-1);}
.logo{display:flex;align-items:center;}
.logo svg{height:40px;width:auto;display:block;}
.topbar .grow{flex:1;}
.ticon{background:none;border:0;color:var(--ink-2);font-size:18px;padding:6px 8px;border-radius:var(--r-xs);}
.ticon:hover{background:var(--page);}
.ticon.acct{display:inline-flex;align-items:center;gap:2px;}
.mainnav .navitem{display:inline-flex;align-items:center;gap:6px;}

/* ══ main nav ══ */
.mainnav{background:var(--surface);border-bottom:1px solid var(--line);
padding:0 34px;display:flex;gap:6px;overflow-x:auto;}
.mainnav button{background:none;border:0;padding:16px 18px 14px;color:var(--ink-2);
font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;}
.mainnav button:hover{color:var(--ink);}
.mainnav button[aria-current=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--olive);
text-transform:uppercase;letter-spacing:.04em;}

/* ══ page ══ */
/* no max-width: the content fills the viewport. The cap used to leave all the
   leftover width as dead space on the right, since there was no auto margin. */
.page{padding:26px 34px 60px;}
.crumbline{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:7px;flex-wrap:wrap;}
.crumbline{font-size:15px;}
.crumbline a{color:var(--blue);text-decoration:none;cursor:pointer;}
.crumbline a:hover{text-decoration:underline;}
body[dir=rtl] .crumbline .sep{transform:scaleX(-1);}
h1.pt{margin:0 0 20px;font-size:27px;font-weight:700;letter-spacing:-.015em;}
h2.sect{margin:30px 0 16px;font-size:22px;font-weight:700;letter-spacing:-.01em;}
.sechead{display:flex;align-items:center;gap:12px;margin:30px 0 16px;}
.sechead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;}
.sechead .grow{flex:1;}


/* ══ pills / toolbar ══ */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.toolbar .grow{flex:1;}
.pills{display:flex;gap:10px;flex-wrap:wrap;}
.pill{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
padding:11px 20px;border-radius:var(--r-sm);font-size:14px;}
.pill:hover{background:var(--hover);}
.pill[aria-selected=true]{background:var(--sage-pill);border-color:var(--sage-pill);
color:#1F3315;font-weight:700;}


/* ══ search screen (Owners-search structure) ══════════════════════════════ */
body.screen-search{background:var(--surface);}
.pdesc{margin:0 0 30px;color:var(--muted);font-size:16px;line-height:1.6;max-width:1040px;}

/* folder tabs — active sheet merges into the panel below */
.ftabs{display:flex;gap:8px;align-items:flex-end;border-bottom:1px solid var(--line);}
.ftab{background:var(--olive-soft);border:1px solid var(--line);border-bottom:0;
border-radius:7px 7px 0 0;padding:15px 30px;color:var(--ink-2);font-size:14px;margin-bottom:-1px;}
.ftab:hover{background:#EBE8D9;}
.ftab[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:700;
text-transform:uppercase;letter-spacing:.05em;padding-bottom:16px;}

/* inline filter panel */
.fpanel{padding:36px 0 0;}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 28px;}
@media(max-width:1240px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:720px){.fgrid{grid-template-columns:1fr;}}
.fgrid+.fgrid{margin-top:24px;}
.fgrid .frow{margin-bottom:0;}
.fgrid .frow>label{font-size:15px;font-weight:400;color:var(--ink);margin-bottom:9px;}
.fgrid input,.fgrid select{padding:14px 14px;font-size:15px;}
.fgrid select{padding-inline-end:40px;}
.fmore{display:flex;align-items:center;gap:18px;margin-top:28px;}
.showmore{background:none;border:0;padding:0;color:var(--ink);font-size:15px;
display:inline-flex;align-items:center;gap:9px;}
.showmore:hover{color:var(--olive-dk);}
.showmore .svgi svg{transition:none;}
.showmore[aria-expanded=true] .svgi{transform:rotate(180deg);}
.fmore .rule{flex:1;height:1px;background:var(--line);}
.factions{display:flex;gap:22px;justify-content:flex-end;margin:28px 0 32px;flex-wrap:wrap;}
.btn-clear{min-width:214px;min-height:52px;background:var(--surface);
border:1px solid var(--line);border-radius:6px;font-size:15px;color:var(--ink);font-weight:400;}
.btn-clear:hover{background:var(--page);}
.factions .btn-search{width:auto;min-width:232px;min-height:52px;border-radius:6px;font-size:15px;}

/* pagination sits under the table, windowed with an ellipsis */
.pgwrap{display:flex;justify-content:flex-end;padding:22px 0 0;}
.pager button[aria-current=true]{background:var(--olive-soft);border-color:#E2DCBE;
color:var(--ink);font-weight:700;}
.pager .ell{min-width:40px;height:40px;display:grid;place-items:center;color:var(--muted);}

/* ══ cards ══ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.card>header{display:flex;align-items:center;gap:10px;padding:15px 18px;
border-bottom:1px solid var(--line-2);}
.card>header h2{margin:0;font-size:15px;font-weight:700;}
.card>header .grow{flex:1;}
.card .body{padding:18px;}
.card .body.flush{padding:0;}
.minus{background:none;border:0;color:var(--muted);font-size:17px;line-height:1;padding:0 4px;}
.minus:hover{color:var(--ink);}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:20px;align-items:start;}
@media(max-width:1160px){.cols{grid-template-columns:1fr;}}

/* ══ forms ══ */
.frow{margin-bottom:14px;}
.frow>label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
color:var(--ink-2);margin-bottom:6px;}
.frow>.ctl{min-width:0;}
input[type=text],input[type=email],input[type=date],select,textarea{
width:100%;padding:10px 12px;border:1px solid #DCDCD6;border-radius:var(--r-sm);
background:var(--surface);font-size:14px;}
/* native select arrow suppressed and replaced with keyboard_arrow_down.svg */
select{appearance:none;-webkit-appearance:none;-moz-appearance:none;
padding-inline-end:38px;
background-image:url("data:image/svg+xml,%3Csvg%20width=%2218%22%20height=%2218%22%20viewBox=%220%200%2018%2018%22%20fill=%22none%22%20xmlns=%22http://www.w3.org/2000/svg%22%3E%20%3Cpath%20d=%22M8.99626%2011.475C8.90626%2011.475%208.82188%2011.4594%208.74313%2011.4281C8.66438%2011.3969%208.59376%2011.35%208.53126%2011.2875L4.97513%207.73138C4.83338%207.58963%204.76563%207.42812%204.77188%207.24687C4.77813%207.06562%204.85001%206.90625%204.98751%206.76875C5.12501%206.63125%205.28438%206.5625%205.46563%206.5625C5.64688%206.5625%205.80626%206.63125%205.94376%206.76875L9.00001%209.84375L12.075%206.76875C12.2125%206.63125%2012.3719%206.56562%2012.5531%206.57187C12.7344%206.57812%2012.8938%206.65%2013.0313%206.7875C13.1688%206.925%2013.2375%207.08437%2013.2375%207.26562C13.2375%207.44687%2013.1666%207.608%2013.0249%207.749L9.46876%2011.2875C9.40126%2011.35%209.32813%2011.3969%209.24938%2011.4281C9.17063%2011.4594%209.08626%2011.475%208.99626%2011.475Z%22%20fill=%22%23374151%22/%3E%20%3C/svg%3E");
background-repeat:no-repeat;background-size:18px 18px;
background-position:right 12px center;}
body[dir=rtl] select{background-position:left 12px center;}
select:disabled{background-image:url("data:image/svg+xml,%3Csvg%20width=%2218%22%20height=%2218%22%20viewBox=%220%200%2018%2018%22%20fill=%22none%22%20xmlns=%22http://www.w3.org/2000/svg%22%3E%20%3Cpath%20d=%22M8.99626%2011.475C8.90626%2011.475%208.82188%2011.4594%208.74313%2011.4281C8.66438%2011.3969%208.59376%2011.35%208.53126%2011.2875L4.97513%207.73138C4.83338%207.58963%204.76563%207.42812%204.77188%207.24687C4.77813%207.06562%204.85001%206.90625%204.98751%206.76875C5.12501%206.63125%205.28438%206.5625%205.46563%206.5625C5.64688%206.5625%205.80626%206.63125%205.94376%206.76875L9.00001%209.84375L12.075%206.76875C12.2125%206.63125%2012.3719%206.56562%2012.5531%206.57187C12.7344%206.57812%2012.8938%206.65%2013.0313%206.7875C13.1688%206.925%2013.2375%207.08437%2013.2375%207.26562C13.2375%207.44687%2013.1666%207.608%2013.0249%207.749L9.46876%2011.2875C9.40126%2011.35%209.32813%2011.3969%209.24938%2011.4281C9.17063%2011.4594%209.08626%2011.475%208.99626%2011.475Z%22%20fill=%22%239AA0A6%22/%3E%20%3C/svg%3E");}
select::-ms-expand{display:none;}
input:focus,select:focus,textarea:focus{border-color:var(--olive);}
input:disabled,select:disabled,textarea:disabled{background:#F6F6F3;color:var(--muted);}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{
border-color:var(--red);background:var(--red-soft);}
.err{color:var(--red-tx);font-size:12.5px;margin-top:5px;}
.hint{color:var(--muted);font-size:12.5px;margin-top:5px;}
.req{color:var(--red);margin-inline-start:2px;}
.newtag{background:var(--olive-soft);color:var(--olive-dk);border:1px solid #E2DCBE;
font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
padding:2px 6px;border-radius:4px;}

/* ══ buttons ══ */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
padding:10px 18px;border-radius:var(--r-sm);font-size:14px;font-weight:600;}
.btn:hover{background:var(--hover);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn-olive{background:var(--olive);border-color:var(--olive);color:#fff;}
.btn-olive:hover{background:var(--olive-dk);}
/* rebuilt from Button.svg — its fill, text colour, radius and height, but as
   real markup so it can stretch full width and localise */
.btn-search{width:100%;background:var(--search-btn);border:1px solid var(--search-btn);
color:#130F26;min-height:41px;border-radius:4px;display:flex;align-items:center;
justify-content:center;gap:9px;font-size:14px;font-weight:600;letter-spacing:.03em;}
.btn-search:hover{background:var(--search-btn-dk);border-color:var(--search-btn-dk);}
.btn-sage{background:var(--sage-pill);border-color:var(--sage-pill);color:#1F3315;}
.btn-sage:hover{background:#ABD199;}
.btn-green{background:var(--green);border-color:var(--green);color:#fff;}
.btn-green:hover{background:#43A047;}
.btn-red{background:var(--surface);border-color:#EFC9CA;color:var(--red-tx);}
.btn-red:hover{background:var(--red-soft);}
.btn-red-solid{background:var(--red);border-color:var(--red);color:#fff;}
.btn-red-solid:hover{background:#D13A3F;}
.btn-grey{background:var(--surface);border-color:var(--line);color:var(--muted);}
.btn.sm{padding:6px 12px;font-size:13px;}
.row-end{display:flex;gap:10px;flex-wrap:wrap;}
.row-end.right{justify-content:flex-end;}

/* square icon action buttons (mockup Actions column) */
.iconsq{width:32px;height:32px;border:1px solid #DCDCD6;background:var(--surface);
border-radius:var(--r-xs);display:inline-grid;place-items:center;color:var(--ink-2);font-size:15px;}
.iconsq:hover{background:var(--hover);border-color:#C9C9C2;}
body[dir=rtl] .iconsq .ar{transform:scaleX(-1);}
.iconbtn{border:1px solid #DCDCD6;background:var(--surface);padding:6px 10px;border-radius:var(--r-xs);}
.iconbtn:hover{background:var(--hover);}

/* gear dropdown */
.actcell{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;}
.gearwrap{position:relative;display:inline-flex;}
.gear{width:32px;height:32px;line-height:0;white-space:nowrap;border:1px solid #DCDCD6;background:var(--surface);
border-radius:var(--r-xs);display:inline-grid;place-items:center;color:var(--ink-2);font-size:14px;}
.gear:hover{background:var(--hover);}
.gear[aria-expanded=true]{background:var(--olive-soft);border-color:#E2DCBE;color:var(--olive-dk);}
/* rendered into #menuRoot, outside the table: a sticky cell creates a stacking
   context and .tw clips overflow, so an in-cell dropdown gets buried/cut off */
.gmenu{position:fixed;min-width:230px;z-index:90;
background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
box-shadow:0 12px 34px rgba(19,15,38,.18);padding:6px;}
.gmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;
background:none;border:0;padding:9px 12px;border-radius:var(--r-xs);
color:var(--ink-2);font-size:13.5px;}
.gmenu button:hover{background:var(--sage-soft);color:var(--ink);}

/* ══ tables ══ */
.tw{overflow-x:auto;}
/* list tables must never scroll sideways: fixed layout, headers may wrap onto a
   second line, values stay on one line and truncate with an ellipsis (full text
   remains available via the cell's title attribute) */
.tw.fit{overflow-x:hidden;}
.tw.fit table.g{table-layout:fixed;width:100%;}
.tw.fit table.g th{white-space:normal;}
.tw.fit table.g td{overflow:hidden;text-overflow:ellipsis;}
.tw.fit table.g th:last-child,.tw.fit table.g td:last-child{width:112px;}
table.g{width:100%;border-collapse:collapse;font-size:14px;}
table.g th{text-align:start;background:var(--thead);font-weight:700;color:var(--ink);
padding:12px 18px;white-space:nowrap;font-size:13.5px;
border-bottom:1px solid var(--row-line);}
table.g td{padding:10px 18px;border-bottom:1px solid var(--row-line);color:var(--ink-2);
white-space:nowrap;}
/* alternating fill: odd rows white, even rows light grey */
table.g tbody tr:nth-child(odd){background:var(--surface);}
table.g tbody tr:nth-child(even){background:var(--zebra);}
/* hover must follow the zebra rules to win on equal specificity */
table.g tbody tr:hover{background:var(--hover);}
table.g tbody tr:last-child td{border-bottom:0;}

.num{text-align:end;}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px;}
.empty .gl{display:block;font-size:30px;color:#C8CBCE;margin-bottom:10px;}
.lnk{background:none;border:0;padding:0;color:var(--blue);font-weight:600;font-size:14px;}
.lnk:hover{text-decoration:underline;}

/* status text colouring */
.stx{font-weight:600;}
.stx.g{color:var(--green-tx);}
.stx.a{color:var(--amber-tx);}
.stx.r{color:var(--red-tx);}
.stx.n{color:var(--muted);}

/* ══ pagination ══ */
.pager{display:flex;gap:8px;justify-content:flex-end;padding:16px 18px;flex-wrap:wrap;}
.pager button{min-width:40px;height:40px;border:1px solid var(--line);background:var(--surface);
color:var(--ink-2);border-radius:var(--r-sm);font-size:14px;}
.pager button[aria-current=true]{background:var(--sage-pill);border-color:var(--sage-pill);
color:#1F3315;font-weight:700;}
.pager button:hover:not([aria-current=true]):not([disabled]){background:var(--hover);}
.pager button[disabled]{opacity:.4;cursor:not-allowed;}
body[dir=rtl] .pager button .ar{transform:scaleX(-1);}

/* ══ tabs (Today/Week/Month underline style) ══ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;
background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:0 8px;}
.tab{background:none;border:0;padding:16px 18px 13px;white-space:nowrap;
color:var(--muted);font-size:14px;border-bottom:3px solid transparent;}
.tab:hover{color:var(--ink-2);}
.tab[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--olive);}
.tabpanel{background:var(--surface);border:1px solid var(--line);border-top:0;
border-radius:0 0 var(--r) var(--r);padding:22px;box-shadow:var(--shadow);}

/* ══ persons summary card ══ */
/* ══ person profile: summary is the lead section, full width, attributes across ══ */
.psummary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
box-shadow:var(--shadow);padding:24px 28px 26px;margin-bottom:20px;}
.psummary .pshead{padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--line-2);}
.psummary .pname{font-size:21px;font-weight:700;letter-spacing:-.015em;}
.psgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px 30px;margin:0;}
@media(max-width:1180px){.psgrid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:720px){.psgrid{grid-template-columns:repeat(2,minmax(0,1fr));}}
.psgrid .it dt{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
color:var(--muted);margin-bottom:7px;}
.psgrid .it dd{margin:0;font-size:14.5px;color:var(--ink);word-break:break-word;line-height:1.5;}

/* ══ accordions ══ */
.ac{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden;}
.ac>button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;
background:var(--surface);border:0;padding:15px 18px;color:var(--ink);font-size:14px;font-weight:600;}
.ac>button:hover{background:var(--hover);}
.ac>button[aria-expanded=true]{background:var(--olive-soft);color:var(--olive-dk);}
.ac>button .grow{flex:1;}
.ac>button .cv{font-size:11px;color:var(--muted);}
.ac>button[aria-expanded=true] .cv{color:var(--olive-dk);}
.acb{border-top:1px solid var(--line-2);padding:18px;}
.ac.nested{border-color:#E4E4DE;}
.ac.nested>button{background:var(--page);}
.ac.nested>button[aria-expanded=true]{background:var(--sage-soft);color:var(--sage-dk);}
.cnt{background:var(--page);border:1px solid var(--line);border-radius:99px;
padding:1px 9px;font-size:12px;font-weight:700;color:var(--muted);}

/* ══ field rows ══ */
.seclabel{display:inline-block;background:var(--olive-soft);color:var(--olive-dk);
font-size:12px;font-weight:700;padding:5px 12px;border-radius:var(--r-xs);margin:22px 0 12px;}
.seclabel.first{margin-top:0;}
dl.fl{margin:0;}
.fr{display:flex;gap:16px;padding:12px 4px;border-bottom:1px solid var(--line-2);}
.fr:last-child{border-bottom:0;}
.fr dt{flex:0 0 40%;font-weight:600;font-size:13.5px;color:var(--ink);}
.fr dd{margin:0;flex:1;text-align:end;font-size:13.5px;color:var(--muted);word-break:break-word;}
body[dir=rtl] .fr dd{text-align:start;}

/* ══ ESB cards ══ */
.esb{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;margin-bottom:10px;
display:flex;gap:18px;align-items:flex-start;background:var(--surface);}
.esb .l{flex:1;}
.esb .t{font-weight:700;margin-bottom:5px;font-size:14px;color:var(--ink);}
.esb .w{color:var(--amber-tx);font-size:13px;}
.esb .r{text-align:end;font-size:12.5px;color:var(--muted);white-space:nowrap;}

/* ══ notices ══ */
.note{display:flex;gap:11px;padding:13px 15px;font-size:13px;border:1px solid;
border-radius:var(--r-sm);margin-bottom:16px;}
.note.blue{background:#EDF3FC;border-color:#CFE0F7;color:#174F9E;}
.note.amber{background:var(--amber-soft);border-color:#EFDCB6;color:var(--amber-tx);}
.note .ic{font-weight:700;}
.unv{background:var(--page);border:1px dashed #D2D2CB;border-radius:var(--r-sm);
padding:14px 16px;font-size:13px;color:var(--muted);margin-bottom:18px;}
.unv b{color:var(--ink-2);}

/* ══ sidebar list card (Frequent Services pattern) ══ */
.listcard .li{display:flex;align-items:center;gap:12px;padding:15px 18px;
border-bottom:1px solid var(--line-2);font-size:14px;color:var(--ink-2);cursor:default;}
.listcard .li:last-child{border-bottom:0;}
.listcard .li .grow{flex:1;}
.listcard .li .ch{color:var(--muted);font-size:13px;}
body[dir=rtl] .listcard .li .ch{transform:scaleX(-1);}
.listcard .li.on{background:var(--sage-soft);font-weight:700;color:var(--ink);}

/* ══ modals ══ */
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.42);display:grid;place-items:center;
padding:24px;z-index:100;overflow:auto;}
.modal{background:var(--surface);border-radius:14px;width:min(700px,100%);
max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.24);}
.modal>header{padding:20px 24px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;}
.modal>header h3{margin:0;font-size:18px;font-weight:700;flex:1;letter-spacing:-.01em;}
.modal .mb{padding:24px;}
.modal>footer{padding:16px 24px;border-top:1px solid var(--line-2);
display:flex;gap:10px;justify-content:flex-end;}
.x{background:none;border:0;color:var(--muted);font-size:19px;padding:2px 6px;border-radius:var(--r-xs);}
.x:hover{background:var(--page);color:var(--ink);}

.cfm{background:var(--surface);border-radius:14px;width:min(440px,100%);
padding:40px 32px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.24);}
.cfm .ring{width:92px;height:92px;border-radius:50%;border:3px solid var(--olive);
color:var(--olive);display:grid;place-items:center;font-size:46px;margin:0 auto 22px;font-weight:300;}
.cfm h3{margin:0 0 10px;font-size:24px;font-weight:700;letter-spacing:-.01em;}
.cfm p{margin:0 0 26px;color:var(--muted);font-size:14px;}
.cfm .acts{display:flex;gap:12px;justify-content:center;}
.cfm .no{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
padding:11px 26px;border-radius:var(--r-sm);font-weight:600;}
.cfm .no:hover{background:var(--page);}
.cfm .yes{background:var(--olive);border:1px solid var(--olive);color:#fff;
padding:11px 32px;border-radius:var(--r-sm);font-weight:600;}
.cfm .yes:hover{background:var(--olive-dk);}

.radios{display:flex;gap:40px;justify-content:center;margin:20px 0;}
.radios label{display:flex;align-items:center;gap:8px;color:var(--sage-dk);
font-size:14px;font-weight:600;}
.chk{width:17px;height:17px;accent-color:var(--olive);}

/* ══ doc sections ══ */
.dsec{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:14px;
overflow:hidden;background:var(--surface);}
.dsec>header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2);}
.dsec>header h4{margin:0;font-size:14px;font-weight:700;flex:1;}
.dsec .b{padding:16px 18px;}

/* ══ sidebar cards (application update panel) ══ */
.sbcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.sbcard>header{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line-2);}
.sbcard>header h3{margin:0;font-size:15px;font-weight:700;flex:1;}
.sbcard .b{padding:16px 18px;}
.sbrow{display:flex;gap:12px;padding:7px 0;font-size:13.5px;}
.sbrow dt{flex:0 0 46%;text-align:end;font-weight:600;color:var(--ink);}
.sbrow dd{margin:0;flex:1;color:var(--muted);}
body[dir=rtl] .sbrow dt{text-align:start;}
.applicant{display:flex;gap:14px;align-items:center;}
.applicant .av{width:56px;height:56px;border-radius:50%;background:var(--olive-soft);
display:grid;place-items:center;font-size:24px;flex:0 0 56px;}
.applicant .mi{font-size:13px;color:var(--muted);line-height:1.7;}
.applicant .mi b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px;}

.toasts{position:fixed;inset-block-end:24px;inset-inline-end:24px;
display:flex;flex-direction:column;gap:10px;z-index:140;}
.toast{background:var(--ink);color:#fff;padding:13px 18px;border-radius:var(--r-sm);
font-size:13.5px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.22);
border-inline-start:3px solid var(--olive);}

</style>
</head>

<nav class="mainnav" id="mainnav"></nav>
<div class="page" id="page"></div>
<div id="menuRoot"></div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>

  var b=list.length
    ? list.map(function(r,i){ return "<tr>"+rowFn(r,i)+"</tr>"; }).join("")
    : '<tr><td colspan="'+cols.length+'"><div class="empty"><span class="gl">&#9993;</span>'+esc(t("noRecords"))+'</div></td></tr>';
  return '<div class="tw"><table class="g'+(cls?" "+cls:"")+'"><thead><tr>'+h+"</tr></thead><tbody>"+b+"</tbody></table></div>";

function fr(label,val){
  return '<div class="fr"><dt>'+esc(label)+"</dt><dd>"+esc(dash(val))+"</dd></div>";
}
function frList(items){ return '<dl class="fl">'+items.map(function(x){ return fr(x[0],x[1]); }).join("")+"</dl>"; }
function seclabel(txt,first){ return '<div class="seclabel'+(first?" first":"")+'">'+esc(txt)+"</div>"; }

function pageList(cur,total){
  if(total<=7){ var a=[]; for(var i=1;i<=total;i++) a.push(i); return a; }
  var out=[1], st=Math.max(2,cur-1), en=Math.min(total-1,cur+1);
  if(cur<=4){ st=2; en=5; }
  if(cur>=total-3){ st=total-4; en=total-1; }
  if(st>2) out.push("...");
  for(var j=st;j<=en;j++) out.push(j);
  if(en<total-1) out.push("...");
  out.push(total);
  return out;
}
function pager(page,total,act){
  if(total<=1 && page===1) return "";
  var out='<div class="pager"><button data-a="'+act+'" data-n="'+(page-1)+'"'
    +(page===1?" disabled":"")+' aria-label="previous"><span class="ar">&lsaquo;</span></button>';
  pageList(page,total).forEach(function(n){
    out += (n==="...")
      ? '<span class="ell">&hellip;</span>'
      : '<button data-a="'+act+'" data-n="'+n+'" aria-current="'+(n===page)+'">'+n+"</button>";
  });
  out+='<button data-a="'+act+'" data-n="'+(page+1)+'"'+(page===total?" disabled":"")
    +' aria-label="next"><span class="ar">&rsaquo;</span></button></div>';
  return out;
}

/* status colour classes mirroring the Application-updates panel */
function sx(v){
  var g=["Completed","Approved","Active","Valid","New","true","Yes"],
      a=["In Progress","Under auditing","Returned","Expired","Suspended","Pending"],
      r=["Rejected","Terminated","Blocked"];
  var c = g.indexOf(v)>-1?"g" : a.indexOf(v)>-1?"a" : r.indexOf(v)>-1?"r" : "n";
  return '<span class="stx '+c+'">'+esc(st(v))+"</span>";
}

/* donut ring for the Overview strip */
function paged(list,page,size){
  var s=size||5, tot=Math.max(1,Math.ceil(list.length/s));
  if(page>tot) page=tot;
  return {slice:list.slice((page-1)*s,page*s), total:tot, page:page};
}
function addMonth(iso){
  if(!iso) return "";
  var p=iso.split("-").map(Number);
  if(p.length!==3||!p[0]||!p[1]||!p[2]) return "";
  var b=new Date(Date.UTC(p[0],p[1]-1,p[2])), x=new Date(Date.UTC(p[0],p[1],p[2]));
  if(x.getUTCMonth()!==(b.getUTCMonth()+1)%12) x.setUTCDate(0);
  return x.toISOString().slice(0,10);
}
function unv(msgKey){
  return '<div class="unv"><b>'+esc(t("unverified"))+" — </b>"+esc(t(msgKey))+"</div>";

function viewSearch(){
  var all=searchFields();
  var primary=all.filter(function(x){ return !x.more; });
  var extra  =all.filter(function(x){ return  x.more; });

  var toggle='<div class="fmore"><button class="showmore" data-a="more" aria-expanded="'
    +(S.moreFilters?"true":"false")+'">'+esc(t(S.moreFilters?"showLess":"showMore"))
    +icon("chevron",20)+'</button><span class="rule"></span></div>';

  /* the toggle always sits directly beneath the last visible field row, so
     "Show less" appears below the revealed filters rather than between them */
  return '<div class="fpanel">'
    +'<div class="fgrid">'+primary.map(filterRow).join("")+"</div>"
    +(S.moreFilters
        ? '<div class="fgrid">'+extra.map(filterRow).join("")+"</div>"+toggle
        : toggle)

      +'<button class="btn-clear" data-a="reset">'+esc(t("clearAll"))+"</button>"
      +'<button class="btn-search" data-a="search">'+icon("search",17)+esc(t("searchBtn"))+"</button>"

function match(r){
  var f=S.applied;
  function like(v,q){ return !q || String(v||"").toLowerCase().indexOf(String(q).toLowerCase())>-1; }
  function dg(v){ return String(v||"").replace(/[\s\-()]/g,""); }
  var idv = S.cat==="companies" ? r.tradeLicenseNumber : r.idNumber;
  if(!like(idv,f.idn)) return false;
  if(!like(r.nameAr,f.nameAr)) return false;
  if(!like(r.nameEn,f.nameEn)) return false;
  if(!like(r.email,f.email)) return false;                                   /* new */
  if(f.phone && dg(r.mobile||r.landLine).indexOf(dg(f.phone))===-1) return false;  /* new */
  return true;
}

  document.documentElement.lang=S.lang;
  document.documentElement.dir=ar()?"rtl":"ltr";
  document.body.setAttribute("dir",ar()?"rtl":"ltr");

  document.getElementById("topbar").innerHTML=
    '<div class="logo">'+ICONS.logo+"</div>"
    +'<div class="grow"></div>'
    +'<button class="ticon" data-a="noop" title="Calendar" aria-label="Calendar">'+icon("calendar",23)+"</button>"
    +'<button class="ticon" data-a="noop" title="Notifications" aria-label="Notifications">'+icon("bell",23)+"</button>"
    +'<button class="ticon acct" data-a="noop" title="Account" aria-label="Account">'
      +icon("profile",23)+icon("chevron",18)+"</button>";

  var nav=[["Dashboard","\u0644\u0648\u062D\u0629 \u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0627\u062A"],
    ["Applications","\u0627\u0644\u0637\u0644\u0628\u0627\u062A"],
    ["Services","\u0627\u0644\u062E\u062F\u0645\u0627\u062A"],
    ["Cases","\u0627\u0644\u0642\u0636\u0627\u064A\u0627"],
    ["Properties","\u0627\u0644\u0639\u0642\u0627\u0631\u0627\u062A"],
    ["Owners","\u0627\u0644\u0645\u0627\u0644\u0643\u0648\u0646"],
    ["Tawtheeq","\u062A\u0648\u062B\u064A\u0642"],
    ["Contracts","\u0627\u0644\u0639\u0642\u0648\u062F"],
    ["Directory","\u0627\u0644\u062F\u0644\u064A\u0644"]];
  document.getElementById("mainnav").innerHTML=
    nav.map(function(n,i){
      return '<button class="navitem">'+esc(t(n))
        +(n[0]==="Services"?icon("chevron",17):"")+"</button>"; }).join("")
    +'<button aria-current="true" data-a="home">'+esc(t("customers"))+"</button>";
}

function renderBody(){
  /* the layer is re-resolved after the body is rebuilt (see tail of this fn) */
  var focus=document.activeElement;
  var fk=focus&&focus.getAttribute?focus.getAttribute("data-b"):null;
  var pos=focus&&focus.selectionStart!=null?focus.selectionStart:null;

  var r=S.route, crumb, h1;
  if(r.name==="cpu"){
    crumb=[t("services"),t("custProfileUpdate"),t("backOfficeConfirm")];
    h1=t("custProfileUpdate");
  } else if(r.name==="exc"){
    crumb=[t("customers"),catLabel(),t("customerException")];  h1=t("customerException");
  } else if(r.name==="detail"){
    crumb=[t("customers"),catLabel(),t("viewDetails")];
    h1 = S.cat==="persons"?t("personProfile") : S.cat==="companies"?t("companyProfile") : t("govProfile");
  } else {
    crumb=[t("customers"),catLabel()]; h1=t("customersSearch");
  }
  crumb=[t("backToDashboard")].concat(crumb);
  var last=crumb.length-1;
  var cl=crumb.map(function(c,i){
    return (i===last ? "<span>"+esc(c)+"</span>"
                     : '<a data-a="home">'+esc(c)+"</a>");
  }).join('<span class="sep">&#8250;</span>');

  /* no Back button: the breadcrumb's "Customers" crumb and the active nav item
     both route home, so returning to the list is still one click. */

  var content;
  switch(r.name){
    case "detail":
      content = S.cat==="persons"?viewPerson() : S.cat==="companies"?viewCompany() : viewGov(); break;
    case "cpu": content=viewCpu(); break;
    case "exc": content=viewException(); break;
    default: content=viewList();
  }

  document.body.classList.toggle("screen-search", r.name==="list");
  document.getElementById("page").innerHTML=
    '<div class="crumbline">'+cl+"</div>"
    +'<h1 class="pt">'+esc(h1)+"</h1>"
    +(r.name==="list" ? '<p class="pdesc">'+esc(t("searchDesc"))+"</p>" : "")
    +content;

  if(fk){
    var again=document.querySelector('[data-b="'+fk+'"]');
    if(again){ again.focus();
      if(pos!=null&&again.setSelectionRange){ try{ again.setSelectionRange(pos,pos); }catch(x){} } }
  }
  renderMenu();
}

/* ── dropdown layer ─────────────────────────────────────────────────────────
   Positioned against the trigger's viewport rect. Lives outside the scroll
   container so it is neither clipped by .tw nor buried under a sticky cell.  */
function renderMenu(){
  var root=document.getElementById("menuRoot");
  if(!root) return;
  if(!S.gear){ root.innerHTML=""; return; }

  var isExc = String(S.gear).charAt(0)==="X";
  var id = isExc ? String(S.gear).slice(1) : S.gear;
  var btn = document.querySelector(isExc
    ? '[data-a="excGear"][data-id="'+id+'"]'
    : '[data-a="gear"][data-id="'+id+'"]');
  if(!btn){ root.innerHTML=""; return; }   /* trigger scrolled out of the DOM */

  var html;
  if(isExc){
    html='<button role="menuitem" data-a="confirm" data-do="delExc" data-id="'+esc(id)+'">'
      +"&#128465; "+esc(t("del").charAt(0)+t("del").slice(1).toLowerCase())+"</button>";
  } else {
    /* Persons: View Details + Edit only.
       Companies / Government Entities keep [CustomerException]. */
    var items=[["view",icon("view",19),t("viewDetails")],["edit",icon("edit",19),t("edit")]];
    if(S.cat!=="persons") items.push(["exc",icon("edit",19),t("custException")]);
    html=items.map(function(i){
      return '<button role="menuitem" data-a="'+i[0]+'" data-id="'+esc(id)+'">'+i[1]+esc(i[2])+"</button>";
    }).join("");
  }
  root.innerHTML='<div class="gmenu" role="menu">'+html+"</div>";

  var m=root.firstChild, r=btn.getBoundingClientRect();
  var vw=window.innerWidth||1280, vh=window.innerHeight||800;
  /* align the menu's inline-end with the trigger's, so it never runs off-screen */
  if(ar()) m.style.right=Math.max(8,vw-r.right)+"px";
  else     m.style.left =Math.max(8,Math.min(r.left, vw-m.offsetWidth-8))+"px";
  var h=m.offsetHeight||0;
  m.style.top = (r.bottom+6+h > vh-8 && r.top-6-h > 0)
    ? (r.top-6-h)+"px"          /* flip above when there is no room below */
    : (r.bottom+6)+"px";
}
function closeMenu(){ S.gear=null; renderMenu(); }

function render(){ renderChrome(); renderBody(); renderModal(); renderMenu(); }

/* ═══════════════════ actions ═══════════════════ */
function home(){
  S.route={name:"list"}; S.tab=null; S.gear=null; S.cpu=null;
  S.appPage=1; S.sigPage=1; S.actPage=1; S.usrPage=1; S.plotOpen={};
  S.poa={no:"",start:"",end:"",status:""};
}
function runConfirm(m){
  var r=rec();
  if(m.doAct==="delExc"&&r){ r.exceptions=r.exceptions.filter(function(x){ return x.id!==m.id; }); toast("Deleted"); }
  else if(m.doAct==="delUser"&&r){ r.users.splice(parseInt(m.n,10),1); toast("Deleted"); }
  else if(m.doAct==="delCpuDoc"&&S.cpu){ S.cpu.docs[m.sec].splice(parseInt(m.n,10),1); toast("Deleted"); }
  else if(m.doAct==="delApp"){ toast("Application deleted"); home(); }
}

document.addEventListener("click",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-a]"):null;
  var a=el?el.getAttribute("data-a"):null;

  if(S.gear && a!=="gear" && a!=="excGear"){ S.gear=null; renderBody(); }
  if(!el) return;
  var id=el.getAttribute("data-id"), r, m;

  switch(a){
    case "noop": return;
    case "cat": S.cat=id; S.draft={}; S.applied={}; S.listPage=1; home(); render(); return;
    case "home": home(); render(); return;

    case "search": S.applied=JSON.parse(JSON.stringify(S.draft)); S.listPage=1; renderBody(); return;
    case "reset": S.draft={}; S.applied={}; S.listPage=1; renderBody(); return;
    case "more": S.moreFilters=!S.moreFilters; renderBody(); return;
    case "listPage": var n=+el.getAttribute("data-n"); if(n>=1){ S.listPage=n; renderBody(); } return;

    case "gear": S.gear=S.gear===id?null:id; renderBody(); return;
    case "excGear": S.gear=S.gear==="X"+id?null:"X"+id; renderBody(); return;

    case "view": S.route={name:"detail",id:id}; S.tab=null; S.gear=null; render(); return;
    case "exc":  S.route={name:"exc",id:id};    S.gear=null; render(); return;
    case "edit":
      r=null; rows().forEach(function(x){ if(x.id===id) r=x; });
      S.route={name:S.route.name,id:id};
      S.modal={kind:"editId",d:{id:id,idNumber:r.idNumber,tradeLicenseNumber:r.tradeLicenseNumber,
        nameAr:r.nameAr,nameEn:r.nameEn,landLine:r.landLine||"",email:r.email||""}};
      S.gear=null; renderBody(); renderModal(); return;
    case "editIdSave":
      m=S.modal;
      if(S.cat==="gov"){
        rows().forEach(function(x){ if(x.id===m.d.id){
          x.landLine=m.d.landLine; x.email=m.d.email;
          x.mobile=m.d.landLine; x.contact.phone=m.d.landLine; x.contact.email=m.d.email; } });
      }
      S.modal=null; toast(ar()?"تم الحفظ":"Saved"); render(); return;

    case "tab": S.tab=id; S.appPage=1; S.sigPage=1; renderBody(); return;
    case "ac": S.ac[id]=!acOpen(id,el.getAttribute("data-def")==="1"); renderBody(); return;
    case "plot": var i=+el.getAttribute("data-n"); S.plotOpen[i]=!S.plotOpen[i]; renderBody(); return;

    case "moi": toast(ar()?"تم التحديث من وزارة الداخلية":"Profile updated from MOI"); return;
    case "ded": toast(ar()?"تم التحديث من الاقتصادية":"Profile updated from DED"); return;

    case "poaSearch": case "sigSearch": renderBody(); return;
    case "poaReset": S.poa={no:"",start:"",end:"",status:""}; renderBody(); return;
    case "poaOpen": toast((ar()?"الوكالة ":"POA ")+id); return;
    case "appPage": S.appPage=+el.getAttribute("data-n"); renderBody(); return;
    case "sigPage": S.sigPage=+el.getAttribute("data-n"); renderBody(); return;
    case "actPage": S.actPage=+el.getAttribute("data-n"); renderBody(); return;
    case "usrPage": S.usrPage=+el.getAttribute("data-n"); renderBody(); return;

    case "viewDoc":
      var w=window.open("","_blank");
      if(w&&w.document){ w.document.write("<title>Document</title><body style='font:14px system-ui;padding:40px'>Document viewer target</body>"); w.document.close(); }
      else toast(ar()?"يُفتح في تبويب جديد":"Opens in a new tab");
      return;
    case "openApp": toast((ar()?"الطلب ":"Application ")+id); return;

    case "addNew":
      S.modal={kind:"add",d:{idNumber:"",tradeLicenseNumber:"",nameAr:"",nameEn:"",landLine:"",email:""}};
      renderModal(); return;
    case "addSave": S.modal=null; toast(ar()?"تم الحفظ":"Saved"); render(); return;

    /* Customer Profile Update page */
    case "cpuOpen": S.route={name:"cpu",id:S.route.id}; S.cpu=null; render(); return;
    case "cpuAddDoc":
      S.modal={kind:"doc",d:{section:el.getAttribute("data-sec"),ref:"",issueDate:"",expiryDate:""},errs:{}};
      renderModal(); return;
    case "docSave":
      m=S.modal;
      var police=m.d.section===POLICE_SECTION;
      var exp=police?addMonth(m.d.issueDate):m.d.expiryDate;
      var de={};
      if(!m.d.issueDate) de.issueDate=t("reqIssue");
      if(!exp) de.expiryDate=t("reqExpiry");
      else if(m.d.issueDate&&exp<=m.d.issueDate) de.expiryDate=t("expiryAfter");
      if(Object.keys(de).length){ m.errs=de; renderModal(); return; }
      S.cpu.docs[m.d.section].push({ref:m.d.ref,issueDate:m.d.issueDate,expiryDate:exp});
      S.modal=null; toast(ar()?"تم إضافة المستند":"Document added"); render(); return;
    case "cpuExempt": S.cpu.isExempted=el.checked; renderBody(); return;
    case "cpuSurvey": S.cpu.isSmartSurvey=el.checked; renderBody(); return;
    case "cpuSubmit":
      var C=S.cpu, ce={};
      if(!String(C.email).trim()) ce.email=t("reqField");
      if(!String(C.mobile).trim()) ce.mobile=t("reqField");
      if(C.isExempted&&!String(C.reasonForExemption).trim()) ce.reason=t("reqField");
      C.errs=ce;
      if(Object.keys(ce).length){ renderBody(); return; }
      toast(ar()?"تم إرسال الطلب":"Application submitted"); home(); render(); return;

    /* exceptions */
    case "excAdd":
      S.modal={kind:"exc",d:{nameA:"",nameE:"",kind:"Redirection",picked:[],page:1},errs:{}};
      renderModal(); return;
    case "excKind": S.modal.d.kind=el.getAttribute("data-v"); renderModal(); return;
    case "excPick":
      var v=el.getAttribute("data-v"), p=S.modal.d.picked, ix=p.indexOf(v);
      if(ix>-1) p.splice(ix,1); else p.push(v);
      renderModal(); return;
    case "excPage": S.modal.d.page=+el.getAttribute("data-n"); renderModal(); return;
    case "excSearch": renderModal(); return;
    case "excSave":
      m=S.modal; r=rec();
      var xe={};
      if(!String(m.d.nameA).trim()) xe.nameA=t("reqField");
      if(!String(m.d.nameE).trim()) xe.nameE=t("reqField");
      if(!m.d.picked.length) xe.picked=t("reqField");
      if(Object.keys(xe).length){ m.errs=xe; renderModal(); return; }
      if(!r.exceptions) r.exceptions=[];
      m.d.picked.forEach(function(wname,k){
        var wf=WORKFLOWS[0];
        WORKFLOWS.forEach(function(x){ if(x[0]===wname) wf=x; });
        r.exceptions.push({id:"N"+Date.now()+k,workflow:wf,nameAr:m.d.kind,nameEn:m.d.kind});
      });
      S.modal=null; toast(ar()?"تمت الإضافة":"Added"); render(); return;

    /* confirm */
    case "confirm":
      var isUser=el.getAttribute("data-do")==="delUser";
      S.modal={kind:"confirm",doAct:el.getAttribute("data-do"),id:id,
        n:el.getAttribute("data-n"),sec:el.getAttribute("data-sec"),
        title:isUser?t("deleteCustomer"):"Delete",
        msg:isUser?(el.getAttribute("data-nm")+" "+t("areYouSure")):t("deleteWarning")};
      S.gear=null; renderBody(); renderModal(); return;
    case "confirmOk": m=S.modal; S.modal=null; runConfirm(m); render(); return;
    case "mclose": S.modal=null; renderModal(); return;
    case "scrim": if(ev.target===el){ S.modal=null; renderModal(); } return;
  }
},false);

document.addEventListener("input",function(ev){
  var el=ev.target, b=el.getAttribute&&el.getAttribute("data-b");
  if(!b) return;
  setPath(b,el.value);
  if(el.getAttribute("data-live")){ b.indexOf("modal.")===0?renderModal():renderBody(); }
},false);

document.addEventListener("change",function(ev){
  var el=ev.target, b=el.getAttribute&&el.getAttribute("data-b");
  if(b&&el.tagName==="SELECT"){
    setPath(b,el.value);
    if(el.getAttribute("data-live")){ S.listPage=1; b.indexOf("modal.")===0?renderModal():renderBody(); }
  }
},false);

document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&S.modal){ S.modal=null; renderModal(); }
},false);

/* Arabic/RTL is still fully implemented; the visible switcher was removed.
   Append ?lang=ar to the URL to review the RTL rendering. */
try{ if(/[?&]lang=ar\b/.test(location.search)) S.lang="ar"; }catch(e){}

window.addEventListener("scroll",function(){ if(S.gear) closeMenu(); },true);
window.addEventListener("resize",function(){ if(S.gear) closeMenu(); });

render();
</script>
</body>
